<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Perfil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>body { background-color: #f8f9fa; padding-top: 70px; }</style>
</head>
<body>
  <div id="navbar-placeholder"></div>
  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <h3 class="mb-4"><i class="fas fa-id-card me-2 text-primary"></i>Mi Perfil</h3>
        <div id="alert" class="alert d-none"></div>
        <div class="card shadow border-0">
          <div class="card-body p-4">
            <form id="profileForm">
              <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" class="form-control" id="username" required />
              </div>
              <div class="mb-3">
                <label class="form-label">Nueva contraseña <span class="text-muted">(dejar vacío para no cambiar)</span></label>
                <input type="password" class="form-control" id="password" />
              </div>
              <button type="submit" class="btn btn-primary w-100">
                <i class="fas fa-save me-2"></i>Guardar cambios
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
    if (!requireAuth()) return;
    renderNavbar("");

    apiFetch("/api/user/profile").then(data => {
      document.getElementById("username").value = data.username;
    }).catch(err => { if (err.status === 401) logout(); });

    document.getElementById("profileForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const alertEl = document.getElementById("alert");
      alertEl.className = "alert d-none";
      const body = { username: document.getElementById("username").value };
      const pw = document.getElementById("password").value;
      if (pw) body.password = pw;
      try {
        await apiFetch("/api/user/profile", { method: "PUT", body: JSON.stringify(body) });
        const user = getUser();
        user.username = body.username;
        localStorage.setItem("user", JSON.stringify(user));
        alertEl.textContent = "Perfil actualizado correctamente";
        alertEl.className = "alert alert-success";
      } catch (err) {
        if (err.status === 401) return logout();
        alertEl.textContent = err.message;
        alertEl.className = "alert alert-danger";
      }
    });
    }); // DOMContentLoaded
  </script>
</body>
</html>
