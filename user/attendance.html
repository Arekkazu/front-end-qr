<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Asistencia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>body { background-color: #f8f9fa; padding-top: 70px; }</style>
</head>
<body>
  <div id="navbar-placeholder"></div>
  <main class="container py-4">
    <h3 class="mb-4"><i class="fas fa-calendar-check me-2 text-primary"></i>Mi Historial de Asistencia</h3>
    <div id="alert" class="alert alert-danger d-none"></div>
    <div class="card shadow border-0">
      <div class="card-body">
        <table class="table table-hover mb-0">
          <thead class="table-primary">
            <tr><th>#</th><th>Fecha y Hora</th></tr>
          </thead>
          <tbody id="tbody">
            <tr><td colspan="2" class="text-center"><div class="spinner-border spinner-border-sm text-primary"></div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
    if (!requireAuth()) return;
    renderNavbar("user-dashboard");

    apiFetch("/api/user/attendance").then(records => {
      const tbody = document.getElementById("tbody");
      if (!records.length) {
        tbody.innerHTML = '<tr><td colspan="2" class="text-center text-muted">Sin registros de asistencia</td></tr>';
        return;
      }
      tbody.innerHTML = records.map((r, i) => `
        <tr>
          <td>${i + 1}</td>
          <td>${new Date(r.timestamp).toLocaleString("es-CO")}</td>
        </tr>`).join("");
    }).catch(err => {
      if (err.status === 401) return logout();
      document.getElementById("alert").textContent = err.message;
      document.getElementById("alert").classList.remove("d-none");
    });
    }); // DOMContentLoaded
  </script>
</body>
</html>
