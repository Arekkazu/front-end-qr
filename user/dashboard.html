<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body { background-color: #f8f9fa; padding-top: 70px; }
    .qr-container { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 0 15px rgba(0,0,0,.1); text-align: center; max-width: 300px; margin: 20px auto; }
    .qr-image { max-width: 100%; border: 2px solid #0d6efd; border-radius: 10px; }
    .countdown { font-weight: bold; color: #dc3545; font-size: 1.2rem; }
  </style>
</head>
<body>
  <div id="navbar-placeholder"></div>
  <main class="container py-4">
    <div id="alert" class="alert alert-danger d-none"></div>
    <div class="row justify-content-center">
      <div class="col-md-6">
        <h3 class="mb-4"><i class="fas fa-qrcode me-2 text-primary"></i>Mi Código QR</h3>
        <div class="qr-container" id="qrBox">
          <div class="spinner-border text-primary" role="status"></div>
        </div>
        <div class="text-center mt-3">
          <button class="btn btn-outline-primary" id="refreshBtn">
            <i class="fas fa-sync-alt me-2"></i>Renovar QR
          </button>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    if (!requireAuth()) throw new Error("not auth");
    renderNavbar("user-dashboard");

    let countdownInterval;

    async function loadQR() {
      clearInterval(countdownInterval);
      const box = document.getElementById("qrBox");
      box.innerHTML = '<div class="spinner-border text-primary" role="status"></div>';
      try {
        const data = await apiFetch("/api/user/dashboard");
        let remaining = data.qr_expiration;
        box.innerHTML = `
          <p class="text-muted mb-2">Muestra este código al administrador</p>
          <img src="data:image/png;base64,${data.qr_img}" class="qr-image" alt="QR Code" />
          <p class="mt-3 mb-0">Expira en: <span class="countdown" id="countdown">${remaining}s</span></p>`;
        countdownInterval = setInterval(() => {
          remaining--;
          const el = document.getElementById("countdown");
          if (el) el.textContent = `${remaining}s`;
          if (remaining <= 0) { clearInterval(countdownInterval); loadQR(); }
        }, 1000);
      } catch (err) {
        if (err.status === 401) return logout();
        document.getElementById("alert").textContent = err.message;
        document.getElementById("alert").classList.remove("d-none");
      }
    }

    document.getElementById("refreshBtn").addEventListener("click", loadQR);
    loadQR();
  </script>
</body>
</html>
