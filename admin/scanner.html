<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrar Asistencia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body { background-color: #f8f9fa; padding-top: 70px; }
    #reader { width: 100%; max-width: 400px; margin: 0 auto; border-radius: 10px; overflow: hidden; }
  </style>
</head>
<body>
  <div id="navbar-placeholder"></div>
  <main class="container py-4">
    <h3 class="mb-4"><i class="fas fa-camera me-2 text-primary"></i>Registrar Asistencia</h3>
    <div id="alert" class="alert d-none mb-3"></div>

    <div class="row g-4">
      <!-- Escáner de cámara -->
      <div class="col-md-6">
        <div class="card shadow border-0">
          <div class="card-body text-center p-4">
            <h5 class="mb-3"><i class="fas fa-camera me-2"></i>Escanear con cámara</h5>
            <div id="reader"></div>
            <button class="btn btn-primary mt-3" id="startBtn">
              <i class="fas fa-play me-2"></i>Iniciar cámara
            </button>
            <button class="btn btn-secondary mt-3 d-none" id="stopBtn">
              <i class="fas fa-stop me-2"></i>Detener
            </button>
          </div>
        </div>
      </div>

      <!-- Ingreso manual -->
      <div class="col-md-6">
        <div class="card shadow border-0">
          <div class="card-body p-4">
            <h5 class="mb-3"><i class="fas fa-keyboard me-2"></i>Ingresar token manualmente</h5>
            <form id="manualForm">
              <div class="mb-3">
                <label class="form-label">Token QR</label>
                <textarea class="form-control" id="qrToken" rows="4" placeholder="Pega aquí el token QR..." required></textarea>
              </div>
              <button type="submit" class="btn btn-success w-100">
                <i class="fas fa-check me-2"></i>Registrar Asistencia
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
    if (!requireAuth("Admin")) return;
    renderNavbar("scanner");

    const alertEl = document.getElementById("alert");
    function showAlert(msg, type = "danger") {
      alertEl.textContent = msg;
      alertEl.className = `alert alert-${type}`;
    }

    async function registerAttendance(token) {
      try {
        const data = await apiFetch("/api/admin/record_attendance", {
          method: "POST",
          body: JSON.stringify({ qr_token: token }),
        });
        showAlert(data.message, "success");
      } catch (err) {
        if (err.status === 401) return logout();
        showAlert(err.message);
      }
    }

    // Escáner de cámara
    let scanner = null;
    document.getElementById("startBtn").addEventListener("click", () => {
      scanner = new Html5Qrcode("reader");
      scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        (decodedText) => {
          scanner.stop();
          document.getElementById("startBtn").classList.remove("d-none");
          document.getElementById("stopBtn").classList.add("d-none");
          registerAttendance(decodedText);
        }
      );
      document.getElementById("startBtn").classList.add("d-none");
      document.getElementById("stopBtn").classList.remove("d-none");
    });

    document.getElementById("stopBtn").addEventListener("click", () => {
      if (scanner) scanner.stop();
      document.getElementById("startBtn").classList.remove("d-none");
      document.getElementById("stopBtn").classList.add("d-none");
    });

    // Ingreso manual
    document.getElementById("manualForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      await registerAttendance(document.getElementById("qrToken").value.trim());
      document.getElementById("qrToken").value = "";
    });
    }); // DOMContentLoaded
  </script>
</body>
</html>
