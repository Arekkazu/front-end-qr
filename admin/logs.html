<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logs de Asistencia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>body { background-color: #f8f9fa; padding-top: 70px; }</style>
</head>
<body>
  <div id="navbar-placeholder"></div>
  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3><i class="fas fa-clipboard-list me-2 text-primary"></i>Logs de Asistencia</h3>
    </div>
    <div id="alert" class="alert d-none"></div>
    <div class="card shadow border-0">
      <div class="card-body">
        <table class="table table-hover mb-0">
          <thead class="table-primary">
            <tr>
              <th>ID Asistencia</th>
              <th>Usuario</th>
              <th>Rol</th>
              <th>Fecha</th>
              <th>Hora Exacta</th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr><td colspan="5" class="text-center"><div class="spinner-border spinner-border-sm text-primary"></div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (!requireAuth("Admin")) return;
      renderNavbar("admin-logs");

      const alertEl = document.getElementById("alert");
      function showAlert(msg, type = "danger") {
        alertEl.textContent = msg;
        alertEl.className = `alert alert-${type}`;
        setTimeout(() => alertEl.className = "alert d-none", 4000);
      }

      async function loadLogs() {
        try {
          const logs = await apiFetch("/api/admin/attendance_logs").catch(err => {
            if (err.status === 401) logout();
            return [];
          });
          
          if (logs.length === 0) {
              document.getElementById("tbody").innerHTML = `<tr><td colspan="5" class="text-center text-muted">No hay registros de asistencia</td></tr>`;
              return;
          }
          
          document.getElementById("tbody").innerHTML = logs.map(l => {
            let time = l.timestamp;
            if (time) {
                const dateObj = new Date(time + "Z"); // Parse as UTC since python sends naive ISO normally
                time = dateObj.toLocaleTimeString();
            }
            return `
              <tr>
                <td>${l.id}</td>
                <td><strong>${l.username}</strong></td>
                <td><span class="badge bg-${l.role === 'Admin' ? 'danger' : 'secondary'}">${l.role}</span></td>
                <td>${l.date}</td>
                <td>${time}</td>
              </tr>
            `;
          }).join("");
        } catch (error) {
          showAlert(error.message);
        }
      }

      loadLogs();
    });
  </script>
</body>
</html>
