<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Asistencias - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>body { background-color: #f8f9fa; }</style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow border-0">
      <div class="card-body p-5">
        <div class="text-center mb-4">
          <i class="fas fa-qrcode fa-3x text-primary mb-3"></i>
          <h2>Iniciar Sesión</h2>
          <p class="text-muted">Ingrese sus credenciales para acceder</p>
        </div>
        <div id="alert" class="alert alert-danger d-none"></div>
        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label">Usuario</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-user"></i></span>
              <input type="text" class="form-control" id="username" required />
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label">Contraseña</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-lock"></i></span>
              <input type="password" class="form-control" id="password" required />
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2">
            <i class="fas fa-sign-in-alt me-2"></i>Ingresar
          </button>
        </form>
        <div class="text-center mt-4 text-muted small">
          <p class="mb-1"><strong>Admin:</strong> admin / admin123</p>
          <p class="mb-0"><strong>Usuario:</strong> usuario / usuario123</p>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script>
    // Redirigir si ya está autenticado
    const user = getUser();
    if (user && localStorage.getItem("token")) {
      window.location.href = user.role === "Admin" ? "/admin/dashboard.html" : "/user/dashboard.html";
    }

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const alert = document.getElementById("alert");
      alert.classList.add("d-none");
      try {
        const data = await apiFetch("/api/auth/login", {
          method: "POST",
          body: JSON.stringify({
            username: document.getElementById("username").value,
            password: document.getElementById("password").value,
          }),
        });
        localStorage.setItem("token", data.token);
        localStorage.setItem("user", JSON.stringify({ username: data.username, role: data.role }));
        window.location.href = data.role === "Admin" ? "/admin/dashboard.html" : "/user/dashboard.html";
      } catch (err) {
        alert.textContent = err.message;
        alert.classList.remove("d-none");
      }
    });
  </script>
</body>
</html>
